name: Daily trend hunt

on:
  schedule:
    - cron: "30 3 * * *"        # ۰۷:۰۰ به وقت تهران (UTC+3:30)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "فقط نمایش، بدون ذخیره و پست"
        type: boolean
        default: true
      limit:
        description: "حداکثر تعداد محصول"
        default: "3"

concurrency:
  group: daily-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - name: Run hunter
        env:
          NFS_SITE_URL: ${{ vars.NFS_SITE_URL || 'https://nfs.nafisstore.com' }}
          NFS_INGEST_KEY: ${{ secrets.NFS_INGEST_KEY }}
          SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ vars.TELEGRAM_CHANNEL_ID || '@NafisSmartTrade' }}
          MINIAPP_LINK: ${{ vars.MINIAPP_LINK }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            ARGS="--limit ${{ inputs.limit }}"
            if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          else
            ARGS=""
          fi
          python scraper/hunt.py $ARGS
